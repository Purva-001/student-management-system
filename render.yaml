# Render Blueprint — Student Management System
# Docs: https://render.com/docs/blueprint-spec

services:
  # ─── Scalable Docker Backend ──────────────────────────────────────
  - type: web
    name: student-backend-docker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    branch: main
    region: ohio
    plan: starter          # Change to "standard" for auto-scaling
    autoDeploy: true
    scaling:
      minInstances: 1
      maxInstances: 3
      targetMemoryPercent: 80
      targetCPUPercent: 80
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false        # Set this manually in Render dashboard (keep secret)
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production

  # ─── MCP Server (Docker) ──────────────────────────────────────────
  - type: web
    name: student-mcp-docker
    runtime: docker
    dockerfilePath: ./mcp-server/Dockerfile
    dockerContext: ./mcp-server
    branch: main
    region: ohio
    plan: starter
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: VERCEL_API_TOKEN
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: MCP_PORT
        value: 3001
